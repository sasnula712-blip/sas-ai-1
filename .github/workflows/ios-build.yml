name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Setup Capacitor iOS with iOS 15 Target
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios || true
          
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/g" ios/App/Podfile
          fi
          
          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          fi
          
          cd ios/App
          pod repo update || true
          pod install --repo-update

      - name: Build Simulator / iOS Binary
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO -destination 'generic/platform=iOS Simulator' build

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-ai-ios-build
          path: |
            ios/App/build
            dist
