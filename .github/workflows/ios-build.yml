name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "SAS AI" "com.sasnula.sasai" --web-dir dist
          npx cap add ios
          npx cap copy ios

      - name: CocoaPods Install
        run: |
          cd ios/App
          pod install

      - name: Build Simulator / iOS Binary
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphonesimulator build

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-ai-ios-build
          path: |
            ios/App/build
            dist
