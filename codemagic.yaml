workflows:
  ios-workflow:
    name: iOS App Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies & build web app
        script: |
          npm install
          npm run build
      - name: Setup Capacitor iOS with iOS 14+ target
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "SAS AI" "com.sasnula.sasai" --web-dir dist
          npx cap add ios
          # Ensure Podfile uses iOS 14.0 minimum deployment target
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" ios/App/Podfile
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" ios/App/Podfile
            sed -i '' "s/platform :ios, '11.0'/platform :ios, '14.0'/g" ios/App/Podfile
          fi
          npx cap sync ios
      - name: Install Pods
        script: |
          cd ios/App
          pod repo update || true
          pod install
      - name: Build iOS App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO -destination 'generic/platform=iOS Simulator' build
    artifacts:
      - ios/App/build/**/*.app
      - ios/App/build/**/*.ipa
      - dist/**/*
