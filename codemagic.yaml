workflows:
  ios-workflow:
    name: iOS App Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Install Capacitor CLI
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "SAS AI" "com.sasnula.sasai" --web-dir dist
          npx cap add ios
          npx cap copy ios
      - name: Build iOS App (.ipa / simulator)
        script: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphonesimulator build
    artifacts:
      - ios/App/build/**/*.app
      - ios/App/build/**/*.ipa
      - dist/**/*
