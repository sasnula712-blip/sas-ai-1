workflows:
  ios-workflow:
    name: iOS App Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies & build web app
        script: |
          npm install
          npm run build

      - name: Setup Capacitor iOS with iOS 15 Target
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios || true
          
          # Force deployment target to iOS 15.0 in Podfile
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/g" ios/App/Podfile
          fi
          
          # Force deployment target in Xcode Project file to iOS 15.0
          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          fi

          # Run CocoaPods install directly with updated target
          cd ios/App
          pod repo update || true
          pod install --repo-update

      - name: Build iOS App (.app / simulator)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO -destination 'generic/platform=iOS Simulator' build
    artifacts:
      - ios/App/build/**/*.app
      - ios/App/build/**/*.ipa
      - dist/**/*
